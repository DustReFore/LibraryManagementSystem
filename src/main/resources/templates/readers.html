<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Читатели</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <div class="collapse navbar-collapse">
            <a class="navbar-brand" th:href="@{/}">Главная</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Книги</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/authors}">Авторы</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/readers}">Читатели</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">Заказы</a></li>
            </ul>
            <a class="btn btn-outline-dark" href="#">Войти</a>
        </div>
    </div>
</nav>
<div class="container my-5">
    <h1 class="mb-4">Список читателей</h1>
    <a class="btn btn-primary mb-3" th:href="@{/readers/add}">Добавить читателя</a>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Год рождения</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reader : ${readers}">
            <td th:text="${reader.id}"></td>
            <td th:text="${reader.firstName}"></td>
            <td th:text="${reader.lastName}"></td>
            <td th:text="${reader.yearOfBirth}"></td>
            <td th:text="${reader.email}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/readers/edit/' + ${reader.id}}">Редактировать</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/readers/delete/' + ${reader.id}}">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
